version: '3'
services:
  db:
    image: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
  django: &django
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      - db
      - redis
      - rabbitmq
      - celery_worker
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: always
    tty: true
    environment:
      - APP_ENV=${APP_ENV}
      - BASE_URL=${BASE_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    volumes:
      - ./data:/data
    command: redis-server --appendonly yes
  rabbitmq:
    image: rabbitmq:3.11.5-alpine
  celery_worker:
    <<: *django
    command: celery -A afstudeerOpdracht worker --loglevel=info
    ports: []
    depends_on:
      - rabbitmq
      - db
